name: Validar jogo no Windows
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test-lock.txt
      - run: python tools/quality.py
      - name: Construir e verificar pacote jogável
        run: |
          python tools/manage.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/manage.py package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-windows
          path: |
            reports/
            dist/*.sha256
      - name: Disponibilizar pacote jogável para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoldadosVsZumbis-1.5.0-Windows-x64
          path: |
            dist/SoldadosVsZumbis-1.5.0-Windows-x64.zip
            dist/SoldadosVsZumbis-1.5.0-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
