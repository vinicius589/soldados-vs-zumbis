name: Exportar snapshot para revisão local

on:
  push:
    branches: [migracao/base-jogavel]
    paths:
      - ".github/workflows/migrate-beta4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: migracao/base-jogavel
          fetch-depth: 1

      - name: Criar ZIP do código e dos recursos
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          output = root / "Soldados-vs-Zumbis-migracao-local.zip"
          excluded = {".git", ".venv", "venv", "__pycache__", ".pytest_cache", ".ruff_cache", "dist", "build"}
          count = 0
          total = 0

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=1, allowZip64=True) as archive:
              for path in root.rglob("*"):
                  if not path.is_file() or path == output:
                      continue
                  relative = path.relative_to(root)
                  if any(part in excluded for part in relative.parts):
                      continue
                  archive.write(path, relative.as_posix())
                  count += 1
                  total += path.stat().st_size

          print(f"Arquivos incluídos: {count}")
          print(f"Bytes de origem: {total}")
          print(f"ZIP pronto: {output} ({output.stat().st_size} bytes)")
          if count < 40 or not (root / "assets/v7/city_beta4_four_lanes.png").is_file():
              raise SystemExit("Snapshot incompleto: faltam arquivos ou recursos da campanha.")
          '@ | Set-Content -Path "$env:RUNNER_TEMP\make_snapshot.py" -Encoding utf8
          python "$env:RUNNER_TEMP\make_snapshot.py"

      - name: Disponibilizar snapshot para trabalho local
        uses: actions/upload-artifact@v4
        with:
          name: Soldados-vs-Zumbis-migracao-local
          path: Soldados-vs-Zumbis-migracao-local.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
